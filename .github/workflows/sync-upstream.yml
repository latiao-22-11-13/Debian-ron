name: Sync upstream

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/Ronlam22/Debian.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            git merge --abort || true
            gh api repos/$GITHUB_REPOSITORY/issues -f title="每日上游同步出现冲突" -f body="自动合并 Ronlam22/Debian 失败,请手动处理。" || true
            exit 1
          fi
